apiVersion: v1
kind: ConfigMap
metadata:
  name: meditriage-config
  namespace: meditriage            # <- el namespace que crea terraform/main.tf
  labels:
    app.kubernetes.io/name: meditriage-api
    app.kubernetes.io/part-of: meditriage
data:
  # Solo configuración NO secreta (12-Factor: config en el entorno).
  # Credenciales (BD, JWT, claves) van en un Secret, nunca aquí.
  APP_ENV: "production"
  LOG_LEVEL: "info"
  PORT: "8000"
