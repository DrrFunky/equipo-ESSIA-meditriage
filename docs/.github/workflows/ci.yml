name: ci-meditriage

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0            # gitleaks revisa el historial

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"    # misma versión que el Dockerfile
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Instalar dependencias
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Formato
        run: ruff format --check .

      - name: Tests y cobertura (>= 70 %)
        run: pytest --cov=main --cov-report=term-missing --cov-fail-under=70

      - name: SAST (Semgrep)
        run: pipx run semgrep scan --config p/python --severity ERROR --error --metrics off

      - name: Secretos (gitleaks)
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks detect --source . --redact --no-banner

  build-and-push:
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Nombre de la imagen (GHCR exige minúsculas)
        id: meta
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/meditriage" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Login en GHCR (solo en main)
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (y push solo en main)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          provenance: false
          tags: ${{ steps.meta.outputs.image }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  promote-to-gitops:
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GITOPS_REPO: ${{ github.repository_owner }}/equipo-ESSIA-meditriage-gitops
      GH_TOKEN: ${{ secrets.GITOPS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.GITOPS_REPO }}
          token: ${{ secrets.GITOPS_TOKEN }}
          path: gitops

      - name: Apuntar overlays/dev al digest nuevo
        working-directory: gitops/overlays/dev
        run: |
          kustomize edit set image ghcr.io/guffy0921/meditriage=${{ needs.build-and-push.outputs.image }}@${{ needs.build-and-push.outputs.digest }}

      - name: Abrir PR en el repo gitops
        working-directory: gitops
        run: |
          git add overlays/dev
          git diff --cached --quiet && echo "Sin cambios" && exit 0
          BRANCH="promote/dev-${GITHUB_SHA::7}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git commit -m "chore(dev): promover imagen ${GITHUB_SHA::7}"
          git push origin "$BRANCH"
          gh pr create --repo "$GITOPS_REPO" --base main --head "$BRANCH" \
            --title "chore(dev): promover imagen ${GITHUB_SHA::7}" \
            --body "Imagen publicada por CI desde ${GITHUB_REPOSITORY}@${GITHUB_SHA}."
