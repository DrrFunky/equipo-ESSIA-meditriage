openapi: 3.1.0
info:
  title: MediTriage API
  description: >
    API para el sistema de apoyo a la priorización clínica MediTriage.
    Permite el registro de pacientes, la solicitud de evaluaciones de
    triage asistidas por IA, la consulta del tablero priorizado en
    tiempo real, y la auditoría de decisiones automatizadas.
  version: 1.0.0

servers:
  - url: https://api.meditriage.example.com/v1
    description: Servidor de producción (placeholder)

security:
  - BearerAuth: []

paths:
  /patients:
    post:
      summary: Registrar un nuevo paciente
      description: >
        Registra un paciente (mapea Historia 3: registro y validación de
        RUT) junto con el check explícito de consentimiento informado.
        Historia Must Have según priorización MoSCoW — obligatoria por
        la Ley 19.628 para procesar datos sensibles de salud.
      operationId: registerPatient
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: >
            Clave única generada por el cliente para evitar registros
            duplicados si la solicitud se reenvía (ej. por mala conexión).
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatientRegistration'
      responses:
        '201':
          description: Paciente registrado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientRegistration'
        '400':
          description: Datos de registro inválidos
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/RFC7807Error'
        '409':
          description: Conflicto de idempotencia (solicitud duplicada con datos distintos)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/RFC7807Error'

  /triage-evaluations:
    post:
      summary: Solicitar una evaluación de triage asistida por IA
      description: >
        Envía los signos vitales y síntomas del paciente para que el
        motor de IA sugiera la categoría ESI y su justificación clínica
        (mapea Historias 1 y 2: Sugerencia ESI automatizada y
        Justificación clínica explicable).
      operationId: createTriageEvaluation
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - patientId
                - symptoms
                - vitalSigns
              properties:
                patientId:
                  type: string
                  format: uuid
                symptoms:
                  type: array
                  items:
                    type: string
                  description: Lista de síntomas reportados por el paciente.
                vitalSigns:
                  type: object
                  description: Signos vitales medidos en el triage.
      responses:
        '202':
          description: Evaluación aceptada y encolada para procesamiento asíncrono
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TriageResult'
        '400':
          description: Datos de evaluación inválidos
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/RFC7807Error'

  /triage-evaluations/{id}:
    patch:
      summary: Confirmar o aplicar fallback manual sobre una evaluación
      description: >
        Permite a la enfermera de triage confirmar la sugerencia ESI
        generada por la IA, o aplicar el fallback manual si el motor de
        IA no respondió.
      operationId: updateTriageEvaluation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                confirmedByNurse:
                  type: boolean
                manualEsiCategory:
                  type: integer
                  minimum: 1
                  maximum: 5
                  description: Categoría ESI asignada manualmente si aplica fallback.
      responses:
        '200':
          description: Evaluación actualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TriageResult'
        '404':
          description: Evaluación no encontrada
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/RFC7807Error'

  /triage-board:
    get:
      summary: Consultar el tablero de pacientes priorizados
      description: >
        Devuelve el listado de pacientes priorizados en tiempo real.
      operationId: getTriageBoard
      responses:
        '200':
          description: Listado de pacientes priorizados
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TriageResult'

  /audit-logs:
    get:
      summary: Consultar el registro de auditoría de decisiones IA
      description: >
        Devuelve el registro inmutable de recomendaciones de la IA para
        fines de trazabilidad.
      operationId: getAuditLogs
      parameters:
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Registro de auditoría
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    evaluationId:
                      type: string
                      format: uuid
                    esiCategory:
                      type: integer
                    justification:
                      type: string
                    timestamp:
                      type: string
                      format: date-time

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "Token JWT para la autenticación segura del personal médico y pacientes."

  schemas:
    PatientRegistration:
      type: object
      description: >
        Payload con los datos del paciente y el check explícito de
        consentimiento informado.
      required:
        - rut
        - fullName
        - consentGiven
        - consentTimestamp
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        rut:
          type: string
          description: RUT chileno del paciente, validado.
          example: "12.345.678-9"
        fullName:
          type: string
        vitalSigns:
          type: object
          description: Signos vitales iniciales al momento del registro.
        consentGiven:
          type: boolean
          description: >
            Check explícito de consentimiento informado (obligatorio
            antes de procesar cualquier dato clínico).
        consentTimestamp:
          type: string
          format: date-time
          description: Marca de tiempo exacta de la aceptación del consentimiento.

    TriageResult:
      type: object
      description: >
        Objeto que contiene la categoría ESI calculada por la IA
        y su justificación clínica explicable.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        patientId:
          type: string
          format: uuid
        esiCategory:
          type: integer
          minimum: 1
          maximum: 5
          description: Categoría ESI sugerida (1 = más crítico, 5 = menos urgente).
        justification:
          type: string
          description: Explicación clínica legible de por qué se sugirió esa categoría.
        confirmedByNurse:
          type: boolean
          default: false
        status:
          type: string
          enum: [pending, ai_suggested, confirmed, manual_fallback]

    RFC7807Error:
      type: object
      description: >
        Esquema de manejo de errores estructurado según RFC 7807.
      properties:
        type:
          type: string
          format: uri
          description: URI que identifica el tipo de error.
          example: "https://meditriage.example.com/errors/validation-error"
        title:
          type: string
          example: "Datos de registro inválidos"
        status:
          type: integer
          example: 400
        detail:
          type: string
          example: "El campo 'rut' no cumple con el formato esperado."
        instance:
          type: string
          format: uri
          example: "/v1/patients"
